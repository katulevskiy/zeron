[package]
name = "zeron-review"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# The review service builds independently of the native app/GPUI workspace.
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2"
jsonwebtoken = "9"

[build-dependencies]
flate2 = "1"
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
