# Staged configuration; do not enable before the Rust service passes health checks.
# Add ONLY this new entry to the existing stream SNI map:
# zeron.exnomic.com 127.0.0.1:8573;
server {
    listen 80;
    listen [::]:80;
    server_name zeron.exnomic.com;
    return 301 https://zeron.exnomic.com$request_uri;
}
server {
    listen 127.0.0.1:8573 ssl http2;
    server_name zeron.exnomic.com;
    ssl_certificate /etc/letsencrypt/live/exnomic.com-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exnomic.com-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}
