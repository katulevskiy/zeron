name: lab-linux
on:
  workflow_dispatch:
    inputs:
      target: {description: "ref/sha of zeron source to test", type: string, default: main}
      save_cache: {description: "save rust caches (seed run)", type: boolean, default: false}
      select: {description: "affected-crates job selection (else run everything)", type: boolean, default: false}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  GPUI_DEPS: >-
    libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
    libx11-dev libxcb1-dev libx11-xcb-dev libfontconfig1-dev libfreetype-dev
    libasound2-dev libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
  BROWSER_TOOLS: xvfb xdotool openbox weston ffmpeg imagemagick fonts-noto-cjk

jobs:
  # ------------------------------------------------------------------- preflight
  # Not in the original workflows and main is not fmt-clean (see report), so this
  # is informational: it never gates the other jobs.
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.target }}"}
      - run: rustup show active-toolchain || rustup toolchain install
      - name: cargo fmt --check (informational)
        continue-on-error: true
        run: cargo fmt --all --check

  # ------------------------------------------------------------------------ plan
  # Affected-crates selection; any doubt => everything runs (scripts/ci/affected.py).
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.p.outputs.core }}
      ui: ${{ steps.p.outputs.ui }}
      browser: ${{ steps.p.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.target }}", fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {path: .lab-ci, sparse-checkout: scripts/ci}
      - id: p
        env:
          SELECT: ${{ inputs.select }}
        run: |
          if [ "$SELECT" = true ]; then
            python3 .lab-ci/scripts/ci/affected.py origin/main HEAD
          else
            printf 'core=true\nui=true\nbrowser=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------------ core
  # Replaces: session-sync-regressions, cursor-compatibility (rust part), preview
  # networking (linux leg). One compile, one nextest run.
  core:
    needs: plan
    if: needs.plan.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.target }}"}
      - uses: actions/checkout@v4
        with: {path: .lab-ci, sparse-checkout: scripts/ci}
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: lab-linux-v2
          shared-key: core
          add-job-id-key: false
          save-if: ${{ inputs.save_cache }}
      - name: Build and run tests (harness, engine, sync, update, doc, preview)
        run: |
          tests=""
          for f in crates/harness/tests/*.rs; do tests="$tests --test $(basename "$f" .rs)"; done
          for f in crates/preview/tests/*.rs; do tests="$tests --test $(basename "$f" .rs)"; done
          cargo nextest run --locked --no-fail-fast \
            -p zeron-harness -p zeron-engine -p zeron-sync -p zeron-update -p zeron-doc -p zeron-preview \
            --features zeron-harness/native-fixture \
            --lib --bins $tests \
            --test session_publication --test restart_resume --test codex_subagents \
            --test local_profiles --test message_queue --test pi_resume \
            --test attachments_roundtrip

  # -------------------------------------------------------------------------- ui
  ui:
    needs: plan
    if: needs.plan.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.target }}"}
      - uses: actions/checkout@v4
        with: {path: .lab-ci, sparse-checkout: scripts/ci}
      - name: Prepare apt .deb dir
        run: mkdir -p ~/apt-debs
      - uses: actions/cache/restore@v4
        id: aptc
        with:
          path: ~/apt-debs/*.deb
          key: lab-linux-apt-v1-gpui-${{ hashFiles('.lab-ci/scripts/ci/apt-install.sh') }}
      - name: GPUI system dependencies
        run: bash .lab-ci/scripts/ci/apt-install.sh $GPUI_DEPS
      - uses: actions/cache/save@v4
        if: ${{ inputs.save_cache && steps.aptc.outputs.cache-hit != 'true' }}
        with:
          path: ~/apt-debs/*.deb
          key: lab-linux-apt-v1-gpui-${{ hashFiles('.lab-ci/scripts/ci/apt-install.sh') }}
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: lab-linux-v2
          shared-key: ui
          add-job-id-key: false
          save-if: ${{ inputs.save_cache }}
      - name: UI and headless layout regressions
        run: cargo nextest run --config-file .lab-ci/scripts/ci/nextest.toml --locked --no-fail-fast -p zeron-ui --lib

  # --------------------------------------------------------------------- browser
  browser:
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.target }}"}
      - uses: actions/checkout@v4
        with: {path: .lab-ci, sparse-checkout: scripts/ci}
      - name: Prepare apt .deb dir
        run: mkdir -p ~/apt-debs
      - uses: actions/cache/restore@v4
        id: aptc
        with:
          path: ~/apt-debs/*.deb
          key: lab-linux-apt-v1-browser-${{ hashFiles('.lab-ci/scripts/ci/apt-install.sh') }}
      - name: GPUI system dependencies
        run: bash .lab-ci/scripts/ci/apt-install.sh $GPUI_DEPS
      - name: Start browser test tool install in the background
        run: |
          rm -f "$RUNNER_TEMP/apt-extras.rc"
          setsid nohup bash -c 'APT_RECOMMENDS=1 bash .lab-ci/scripts/ci/apt-install.sh $BROWSER_TOOLS; echo $? > "$RUNNER_TEMP/apt-extras.rc"' \
            > "$RUNNER_TEMP/apt-extras.log" 2>&1 < /dev/null &
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: lab-linux-v2
          shared-key: ui
          add-job-id-key: false
          save-if: false
      - name: Build browser fixture (dev profile)
        run: cargo build --locked -p zeron-ui --example browser-fixture --features browser-fixture
      - name: Wait for browser test tools
        run: |
          while [ ! -f "$RUNNER_TEMP/apt-extras.rc" ]; do sleep 2; done
          cat "$RUNNER_TEMP/apt-extras.log"
          [ "$(cat "$RUNNER_TEMP/apt-extras.rc")" = 0 ]
      - uses: actions/cache/save@v4
        if: ${{ inputs.save_cache && steps.aptc.outputs.cache-hit != 'true' }}
        with:
          path: ~/apt-debs/*.deb
          key: lab-linux-apt-v1-browser-${{ hashFiles('.lab-ci/scripts/ci/apt-install.sh') }}
      - name: X11 and Wayland browser regressions
        timeout-minutes: 5
        env:
          RUST_LOG: gpui_wgpu=info
          BROWSER_FIXTURE_BINARY: target/debug/examples/browser-fixture
        run: |
          scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/default"
          VK_DRIVER_FILES=/dev/null scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/opengl"
      - name: Upload native browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-browser
          path: ${{ runner.temp }}/linux-browser
          if-no-files-found: warn
          retention-days: 1

  # -------------------------------------------------------------- no-rust jobs
  cursor-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.target }}"}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Dependency updater validation
        run: python3 scripts/test-update-cursor-sdk.py
      - name: Install the exact SDK selected by this engine
        run: |
          pin=$(python3 -c 'import re; print(re.search(r"const CURSOR_SDK_PIN: &str = \"([^\"]+)\"", open("crates/harness/src/cursor/mod.rs").read())[1])')
          npm install --prefix "$RUNNER_TEMP/cursor-sdk-contract" --ignore-scripts --no-audit --no-fund "$pin"
      - name: Actual SDK token expiry, stream invalidation, and transient auth recovery
        run: node scripts/test-cursor-sdk-auth.mjs "$RUNNER_TEMP/cursor-sdk-contract/node_modules/@cursor/sdk"

  preview-coordinator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.target }}"}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.target }}"}
      - uses: actions/checkout@v4
        with: {path: .lab-ci, sparse-checkout: scripts/ci}
      - name: Desktop entry validator
        run: |
          if [ ! -f scripts/test-linux-desktop-entry.sh ]; then
            echo "::notice::target predates scripts/test-linux-desktop-entry.sh; skipping (original workflow is path-filtered)"
            exit 0
          fi
          command -v desktop-file-validate || bash .lab-ci/scripts/ci/apt-install.sh desktop-file-utils
      - name: Installers write a valid launcher entry
        run: |
          if [ ! -f scripts/test-linux-desktop-entry.sh ]; then echo "skipped"; exit 0; fi
          scripts/test-linux-desktop-entry.sh
