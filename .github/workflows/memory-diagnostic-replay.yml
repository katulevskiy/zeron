name: Replay document Memcheck
on:
  push:
    branches: [codex/memory-hardening]
    paths: ['.github/workflows/memory-diagnostic-replay.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y valgrind
      - name: Replay exact binary with precise definedness checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir evidence
          gh run download 37088676081 --repo katulevskiy/zeron --name memory-evidence-linux --dir original
          chmod +x original/memory-audit
          sha256sum original/memory-audit > evidence/binary.sha256
          nm -C original/memory-audit | grep 'DocHost>::open_local' > evidence/open-local-symbols.txt
          objdump -d -C original/memory-audit | sed -n '/<zeron_engine::doc_host::DocHost>::open_local.*>:/,+145p' > evidence/open-local-disassembly.txt
          set +e
          timeout 300 valgrind --error-exitcode=97 --expensive-definedness-checks=yes --leak-check=full --show-leak-kinds=definite,indirect --errors-for-leak-kinds=definite,indirect --track-origins=yes --num-callers=30 --xml=yes --xml-file=evidence/memcheck-docs-precise.xml original/memory-audit docs > evidence/docs.jsonl 2> evidence/docs.stderr
          result=$?
          echo "$result" > evidence/exit-code.txt
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: document-memcheck-replay
          path: evidence
