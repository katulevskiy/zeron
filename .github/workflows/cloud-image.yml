name: cloud-image

# Build and push the cloud box image, docker.io/zeronsh/zeron-cloud:<version>
# (docs/cloud.md, cloud/image/Dockerfile). Provisioning pins the box to the
# image of the version that provisions it, so every release needs one.
#
# Trigger: the `release` workflow finishing for a `v<version>` tag (the image
# packages that release's Linux x86_64 binary), or by hand for an existing
# release. A release created with GITHUB_TOKEN doesn't fire `release` events
# for other workflows, hence `workflow_run`.
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token with
# write access to zeronsh/zeron-cloud).

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to package (e.g. 0.2.99)"
        required: true

permissions:
  contents: read

jobs:
  image:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then ver="${INPUT_VERSION#v}"; else ver="${HEAD_BRANCH#v}"; fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: the release's Linux x86_64 binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "zeron-$VERSION-linux-x86_64.tar.gz" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/zeron-$VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/zeron-$VERSION-linux-x86_64/zeron" cloud/image/zeron
          file cloud/image/zeron
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: cloud/image
          platforms: linux/amd64
          build-args: |
            ZERON_LIBC=gnu
          push: true
          tags: |
            docker.io/zeronsh/zeron-cloud:${{ env.VERSION }}
            docker.io/zeronsh/zeron-cloud:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
