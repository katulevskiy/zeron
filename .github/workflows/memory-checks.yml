name: Memory checks

on:
  # Full diagnostics exceed the seven-minute automatic CI budget on cold caches.
  # Run explicitly when investigating retention or validating memory changes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valgrind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 1
      CARGO_PROFILE_RELEASE_STRIP: none
      # Keep optimized code and source locations, without distribution-only LTO.
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: memory-no-lto
          save-rust-cache: 'true'
          apt-cache: valgrind
          apt-packages: valgrind
      # UI tests already runs the core regressions. Build only the diagnostic
      # example and font lifetime test here, instead of a second test suite.
      - name: Valgrind Memcheck and Massif
        run: bash scripts/ci/check-memory.sh
      - name: Upload memory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-evidence-linux
          path: target/memory-evidence
          if-no-files-found: warn
