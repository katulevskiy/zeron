name: Fast linker
description: >-
  Link Rust faster: mold on Linux (Rust's default there is already LLD; mold
  is faster still), LLD (rust-lld, shipped with the toolchain) instead of
  link.exe on Windows. macOS keeps Apple's linker (ld-prime, already fast).
  Run it before the Rust cache step: the settings are part of the cache key.

inputs:
  enabled:
    description: "'false' leaves the platform's default linker (for comparisons)."
    default: 'true'

runs:
  using: composite
  steps:
    - name: mold (Linux)
      if: inputs.enabled == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        # Pinned release, verified against a checksum (the project publishes none; this is
        # the sha256 of the GitHub release asset).
        version=3.0.0
        sha256=6c90d4a474c7c0409dfb575be03a5345878ac14fdba18de8b40fa58c60121189
        dir="$RUNNER_TOOL_CACHE/mold-$version"
        if [ ! -x "$dir/bin/mold" ]; then
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o "$RUNNER_TEMP/mold.tar.gz" \
            "https://github.com/rui314/mold/releases/download/v$version/mold-$version-x86_64-linux.tar.gz"
          echo "$sha256  $RUNNER_TEMP/mold.tar.gz" | sha256sum -c -
          mkdir -p "$dir"
          tar -xzf "$RUNNER_TEMP/mold.tar.gz" -C "$dir" --strip-components=1
        fi
        "$dir/bin/mold" --version
        # rustc links through cc with its own LLD (-fuse-ld=lld); the last -fuse-ld wins and
        # -B lets cc find ld.mold. Target-specific, so cross builds (Android) are untouched.
        echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=mold -C link-arg=-B$dir/bin" >> "$GITHUB_ENV"
    - name: LLD (Windows)
      if: inputs.enabled == 'true' && runner.os == 'Windows'
      shell: pwsh
      # rust-lld ships with the toolchain; rustc finds it in its own tools directory and
      # gives it the MSVC library paths it gives link.exe.
      run: '"CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe" >> $env:GITHUB_ENV'
