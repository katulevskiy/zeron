# nextest settings for the Linux lab workflow (passed with --config-file so the
# tested branch does not need to carry it).
#
# zeron-ui `state::tests::bootstrap_reports_local_assembly_failure_before_returning_a_handle`
# bootstraps an engine on a "free" port (bind(:0)+drop), makes the bootstrap fail,
# then asserts nothing accepts connections on that port ("failed bootstrap must
# release the IPC listener").  In the dev profile it fails on the first attempt in
# ~1 of 2 runs and passes on the retry, even when run alone (runs 36764470875,
# 36770059041, 36771839200), so it is a timing race in teardown/port handling that
# the original release-profile + --test-threads=1 run does not hit.  Not a CI
# regression; a retry is the honest mitigation (nextest reports it as FLAKY).
[[profile.default.overrides]]
filter = 'package(zeron-ui) & test(/^state::tests::/)'
retries = 2
